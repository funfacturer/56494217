<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1d3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Adventskalender</title>
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
</head>
<body>

  <!-- Schneefall -->
  <div id="snow-container"></div>

  <header>
    <h1>✨ Adventskalender ✨</h1>
    <p>Finde und öffne das heutige Türchen</p>
  </header>

  <!-- Freier Bereich für verstreute Türchen -->
  <main class="calendar-canvas" id="calendar"></main>

  <div class="controls">
    <label class="toggle-label">
      <input type="checkbox" id="test-mode">
      <span>Testmodus</span>
    </label>
    <button class="btn-text" id="reset-btn">Neu anordnen</button>
  </div>

  <!-- Modal / Großansicht -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-badge" id="modal-day-badge">Tag 1</div>
      <div class="modal-icon">🎁</div>
      <p id="modal-content">Inhalt</p>
      <button class="btn-primary" id="modal-close">Schließen</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
